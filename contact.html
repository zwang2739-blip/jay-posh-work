<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACT | JAY POSH</title>
    
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* --- 全局設定 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #f4f4f0; 
            color: #000000; 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden; 
            line-height: 1.6;
        }
        a { text-decoration: none; color: inherit; cursor: pointer; }

        /* --- Header (已與其他頁面完全同步) --- */
        header {
            position: fixed; top: 0; left: 0; width: 100%; 
            display: flex; flex-direction: column; align-items: center;
            padding: 30px 50px;
            z-index: 100; 
            background: transparent;
            color: #000; 
        }
        .header-top { width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .nav-links { display: flex; gap: 30px; }
        .nav-link { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #000; position: relative; font-weight: 500; }
        .nav-link.active::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 100%; height: 1px; background: currentColor; }

        /* =========================================
           ★ Contact 區塊版面 ★
           ========================================= */
        .contact-section {
            width: 100%;
            min-height: 100vh;
            padding: 150px 50px 50px 50px;
            display: flex;
            align-items: stretch;
            justify-content: space-between;
            max-width: 1400px;
            margin: 0 auto;
            gap: 100px;
        }

        /* --- 左側：資訊與狀態 --- */
        .contact-left {
            width: 40%;
            display: flex;
            flex-direction: column;
        }
        .contact-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 5rem;
            line-height: 1.1;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        /* 閃爍狀態燈 */
        .status-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 50px;
            padding: 15px 20px;
            border: 1px solid #ddd;
            border-radius: 50px;
            width: fit-content;
            background: #fff;
        }
        .status-dot {
            width: 10px; height: 10px;
            background-color: #4caf50; /* 綠色 */
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(76, 175, 80, 0); }
            100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
        }
        .status-text { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        .contact-info-block { margin-bottom: 30px; }
        .info-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #888; margin-bottom: 5px; display: block; }
        .info-value { font-size: 1.2rem; font-weight: 500; }
        .info-value a { border-bottom: 1px solid transparent; transition: border-color 0.3s; }
        .info-value a:hover { border-color: #000; }

        /* --- 右側：高級感詢價表單 --- */
        .contact-right {
            width: 55%;
            background: #fff;
            padding: 60px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
        }
        .form-header { font-size: 1.5rem; font-family: 'Cormorant Garamond', serif; margin-bottom: 40px; border-bottom: 1px solid #000; padding-bottom: 20px; }

        .form-group { margin-bottom: 35px; }
        
        /* 無邊框極簡輸入框 */
        input[type="text"], input[type="email"], select, textarea {
            width: 100%;
            padding: 15px 0;
            border: none;
            border-bottom: 1px solid #ccc;
            background: transparent;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            color: #000;
            transition: border-color 0.3s;
            outline: none;
        }
        input:focus, select:focus, textarea:focus { border-bottom: 1px solid #000; }
        
        /* 讓 Select 選單好看一點 */
        select { appearance: none; cursor: pointer; border-radius: 0; }
        
        textarea { resize: vertical; min-height: 100px; }

        ::placeholder { color: #aaa; font-weight: 300; }

        .submit-btn {
            display: inline-block;
            background: #000;
            color: #fff;
            padding: 18px 40px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: none;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            width: 100%;
            margin-top: 20px;
        }
        .submit-btn:hover { background: #333; transform: translateY(-2px); }

        /* RWD */
        @media (max-width: 900px) {
            .contact-section { flex-direction: column; padding: 120px 30px 50px 30px; gap: 60px; }
            .contact-left, .contact-right { width: 100%; }
            .contact-title { font-size: 3.5rem; }
            .contact-right { padding: 40px 20px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <a href="index.html" class="logo">JAY POSH</a>
            <nav class="nav-links">
                <a href="about.html" class="nav-link">About</a>
                <a href="work.html" class="nav-link">Work</a>
                <a href="music.html" class="nav-link">Music</a>
                <a href="contact.html" class="nav-link active">Contact</a>
            </nav>
        </div>
    </header>

    <section class="contact-section">
        <div class="contact-left">
            <h1 class="contact-title">Let's Work<br>Together.</h1>
            
            <div class="status-box">
                <div class="status-dot"></div>
                <span class="status-text">Available for Freelance</span>
            </div>

            <div class="contact-info-block">
                <span class="info-label">Direct Email</span>
                <span class="info-value"><a href="mailto:zwang2739@gmail.com">zwang2739@gmail.com</a></span>
            </div>

            <div class="contact-info-block">
                <span class="info-label">Instagram</span>
                <span class="info-value"><a href="https://instagram.com/jayposh_w" target="_blank">@jayposh_w</a></span>
            </div>

            <div class="contact-info-block">
                <span class="info-label">Location</span>
                <span class="info-value">Taoyuan, Taiwan</span>
            </div>
        </div>

        <div class="contact-right">
            <h2 class="form-header">Project Inquiry</h2>
            <form action="#" method="POST">
                
                <div class="form-group">
                    <input type="text" name="name" placeholder="Your Name / Brand Name *" required>
                </div>
                
                <div class="form-group">
                    <input type="email" name="email" placeholder="Email Address *" required>
                </div>

                <div class="form-group">
                    <select name="service" required>
                        <option value="" disabled selected>What do you need help with? *</option>
                        <option value="art_direction">Art Direction & Moodboard</option>
                        <option value="photography">Commercial Photography</option>
                        <option value="branding">Brand Identity / Logo</option>
                        <option value="web_design">Web Design</option>
                        <option value="other">Other / Not Sure Yet</option>
                    </select>
                </div>

                <div class="form-group">
                    <select name="budget">
                        <option value="" disabled selected>Estimated Budget Range</option>
                        <option value="under_30k">Under $30,000 TWD</option>
                        <option value="30k_50k">$30,000 - $50,000 TWD</option>
                        <option value="50k_100k">$50,000 - $100,000 TWD</option>
                        <option value="over_100k">$100,000+ TWD</option>
                    </select>
                </div>

                <div class="form-group">
                    <textarea name="message" placeholder="Tell me a bit about your project, timeline, and goals..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Inquiry ↗</button>
            </form>
        </div>
    </section>

</body>
</html>

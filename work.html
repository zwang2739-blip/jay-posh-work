<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORK | JAY POSH</title>
    
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* --- 全局設定 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #f8f8f6;
            color: #000000; 
            font-family: 'Inter', sans-serif; 
            /* 關鍵：改為 auto 讓網頁可以往下滾動 */
            overflow-y: auto; 
            overflow-x: hidden;
            width: 100vw;
            user-select: none;
        }
        
        /* --- Header --- */
        header {
            position: fixed; top: 0; left: 0; width: 100%; 
            padding: 30px 50px;
            z-index: 1000; 
            pointer-events: none; 
            background: linear-gradient(to bottom, rgba(248,248,246,0.9) 0%, rgba(248,248,246,0) 100%);
        }
        .header-content { pointer-events: auto; display: flex; width: 100%; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; font-weight: 700; text-transform: uppercase; color: #000; text-decoration: none;}
        .nav-links { display: flex; gap: 30px; }
        .nav-link { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #000; text-decoration: none; position: relative; }
        .nav-link.active::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 100%; height: 1px; background: #000; }

        /* =========================================
           ★ Work 瀑布流雜誌排版 ★
           ========================================= */
        #gallery-canvas {
            padding: 120px 40px 80px 40px; /* 留出 Header 與底部的空間 */
            max-width: 1600px;
            margin: 0 auto;
            /* 純 CSS 瀑布流設定 */
            column-count: 4; /* 電腦版分成 4 欄 */
            column-gap: 20px; /* 欄間距 */
            
            /* 載入動畫設定 */
            opacity: 0; 
            transition: opacity 0.8s ease-out;
        }
        
        #gallery-canvas.loaded { opacity: 1; }

        .gallery-img-container {
            display: inline-block; /* 瀑布流必備 */
            width: 100%; /* 填滿欄寬 */
            margin-bottom: 20px; /* 圖與圖的垂直間距 */
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            background: #fff;
            padding: 10px; /* 模擬照片拍立得白框感，很加分 */
            break-inside: avoid; /* 防止圖片跨欄斷開 */
        }

        .gallery-img-container img {
            width: 100%; height: auto; display: block;
            object-fit: cover;
            filter: grayscale(15%); /* 微灰階增加質感 */
            transition: 0.5s ease;
        }

        /* 互動效果 */
        .gallery-img-container:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            z-index: 10;
            position: relative;
        }
        .gallery-img-container:hover img {
            filter: grayscale(0%); /* 滑過恢復彩色 */
        }

        /* 創造雜誌感：設定特定照片的大小 */
        .editorial-sm { column-span: 1; } /* 預設小圖占 1 欄 */
        .editorial-lg { column-span: 2; } /* 大圖占 2 欄，創造視覺重點 */

        /* RWD 瀑布流手機版適應 */
        @media (max-width: 1200px) {
            #gallery-canvas { column-count: 3; }
        }
        @media (max-width: 900px) {
            #gallery-canvas { column-count: 2; padding: 100px 20px; }
            .editorial-lg { column-span: 1; } /* 平板/手機版全部一樣大，避免破版 */
        }
        @media (max-width: 500px) {
            #gallery-canvas { column-count: 1; column-gap: 15px; padding: 80px 15px; }
            .gallery-img-container { margin-bottom: 15px; padding: 8px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <a href="index.html" class="logo">JAY POSH</a>
            <nav class="nav-links">
            <a href="about.html" class="nav-link">About</a>
            <a href="work.html" class="nav-link active">Work</a>
            <a href="music.html" class="nav-link">Music</a>
            <a href="contact.html" class="nav-link">Contact</a>
        </nav>
        </div>
    </header>

    <div id="gallery-canvas">
        
        <div class="gallery-img-container editorial-sm"><img src="images/split-1.jpg"></div>
        <div class="gallery-img-container editorial-sm"><img src="images/split-2.jpg"></div>
        <div class="gallery-img-container editorial-sm"><img src="images/split-3.jpg"></div>
        <div class="gallery-img-container editorial-sm"><img src="images/split-4.jpg"></div>

        <div class="gallery-img-container editorial-lg">
            <img src="images/p2.jpg"> 
        </div>

        <div class="gallery-img-container editorial-sm"><img src="images/work3.jpg"></div>
        <div class="gallery-img-container editorial-sm"><img src="images/work49.jpg"></div>
        <div class="gallery-img-container editorial-sm"><img src="images/p5.jpg"></div> 
        <div class="gallery-img-container editorial-sm"><img src="images/work60.jpg"></div>

        <div class="gallery-img-container editorial-lg">
            <img src="images/work36.jpg">
        </div>

        <div class="gallery-img-container editorial-sm"><img src="images/work50.jpg"></div>
        <div class="gallery-img-container editorial-sm"><img src="images/work55.jpg"></div>
        <div class="gallery-img-container editorial-sm"><img src="images/work11.jpg"></div>
        <div class="gallery-img-container editorial-sm"><img src="images/work12.jpg"></div>
        <div class="gallery-img-container editorial-sm"><img src="images/work13.jpg"></div>
        <div class="gallery-img-container editorial-sm"><img src="images/work33.jpg"></div>
        
        <div class="gallery-img-container editorial-sm"><img src="images/p3.jpg"></div>
        <div class="gallery-img-container editorial-sm"><img src="images/p4.jpg"></div>
        <div class="gallery-img-container editorial-sm"><img src="images/work52.jpg"></div>
        
        <div class="gallery-img-container editorial-lg">
            <img src="images/work14.jpg">
        </div>

        <div class="gallery-img-container editorial-sm"><img src="images/work53.jpg"></div>
        <div class="gallery-img-container editorial-sm"><img src="images/work54.jpg"></div>
        <div class="gallery-img-container editorial-sm"><img src="images/work65.jpg"></div>
        <div class="gallery-img-container editorial-sm"><img src="images/work72.jpg"></div>
        <div class="gallery-img-container editorial-sm"><img src="images/work74.jpg"></div>
        <div class="gallery-img-container editorial-sm"><img src="images/p7.jpg"></div>
        <div class="gallery-img-container editorial-sm"><img src="images/p8.jpg"></div>
        <div class="gallery-img-container editorial-sm"><img src="images/p9.jpg"></div>
        <div class="gallery-img-container editorial-sm"><img src="images/work38.jpg"></div>
        <div class="gallery-img-container editorial-sm"><img src="images/work39.jpg"></div>

    </div>

    <script>
        const canvas = document.getElementById('gallery-canvas');
        const items = Array.from(document.querySelectorAll('.gallery-img-container'));
        let hasInitialized = false; 

        function initGallery() {
            if (hasInitialized) return;
            hasInitialized = true;
            // 圖片載入後顯示畫布
            canvas.classList.add('loaded');
        }

        let imagesLoadedCount = 0;
        const totalImages = items.length;

        items.forEach(item => {
            const img = item.querySelector('img');
            const handleLoad = () => {
                imagesLoadedCount++;
                if (imagesLoadedCount === totalImages) initGallery();
            };
            if (img.complete) {
                handleLoad(); 
            } else {
                img.onload = handleLoad; 
                img.onerror = handleLoad; // 即使破圖也不要卡住
            }
        });

        // 安全機制：超時 1.5 秒強制顯示
        setTimeout(() => { 
            if (!hasInitialized) initGallery(); 
        }, 1500);
    </script>
</body>
</html>
